# Test-only config so @SpringBootTest (ApplicationTests.contextLoads) boots with
# an in-memory H2 DB and dummy secrets — no Postgres, no real env vars needed.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.security.public-matchers=/api/v1/auth/**
spring.security.jwt.password=testsecrettestsecrettestsecret123456
spring.security.jwt.issuer=aidocrag-test
spring.security.jwt.expiration-hours=24

spring.cors.allowed-origins=http://localhost:5173

rag.api.url=http://localhost:5000
