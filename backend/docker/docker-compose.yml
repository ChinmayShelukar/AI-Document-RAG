services:
  postgres:
    image: postgres:17
    container_name: postgres-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ia-network

  rag-server:
    build:
      context: ../
      dockerfile: docker/Dockerfile.python
    container_name: rag-server
    ports:
      - "${RAG_SERVER_HOST_PORT}:5000"
    volumes:
      # Persist uploaded documents so runtime ingests survive restarts
      - rag-data:/app/data
    networks:
      - ia-network
    restart: unless-stopped

  springboot-api:
    build:
      context: ../
      dockerfile: docker/Dockerfile.java
    container_name: springboot-api
    ports:
      - "${SPRINGBOOT_API_HOST_PORT}:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:${POSTGRES_PORT}/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}

      - SPRING_SECURITY_JWT_PASSWORD=${JWT_SECRET}
      - SPRING_SECURITY_JWT_ISSUER=${JWT_ISSUER}
      - SPRING_SECURITY_JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS}

      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - COOKIE_SECURE=${COOKIE_SECURE}
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE}

      - RAG_API_URL=${RAG_API_URL}
    depends_on:
      - postgres
      - rag-server
    networks:
      - ia-network

volumes:
  postgres-data:
  rag-data:

networks:
  ia-network:
    driver: bridge
